<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Media Controller</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <!-- Header Card -->
    <div class="header-card">
        <div class="header-left">
            <div class="logo-icon-wrapper">
                <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5.14v14l11-7-11-7z"/>
                </svg>
            </div>
            <div class="header-text">
                <h1>Media Booster</h1>
                <p>Tab Media Control v2.2</p>
            </div>
        </div>
        <label class="theme-switch" title="Toggle Dark/Light Mode">
            <input type="checkbox" id="themeToggle" checked>
            <span class="switch-slider">
                <span class="switch-icon switch-sun-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </span>
            </span>
        </label>
    </div>

    <!-- Activation / Site scope Card -->
    <div class="section section-sites">
        <div class="sites-head">
            <div class="sites-head-left">
                <span class="save-title-small">ACTIVATION</span>
                <span class="sites-title">Where it runs</span>
            </div>
            <div id="siteStatusBadge" class="save-badge save-badge--none">CHECKING…</div>
        </div>

        <div class="seg" id="modeSeg" role="group" aria-label="Activation scope">
            <button class="seg-btn" data-mode="whitelist" id="segWhitelist">Whitelist only</button>
            <button class="seg-btn" data-mode="all" id="segAll">All sites</button>
        </div>

        <div class="sites-current">
            <span class="sites-current-host" id="currentHostLabel">—</span>
            <button class="btn-mini" id="btnToggleSite">Add</button>
        </div>

        <div id="whitelistArea">
            <div class="sites-add">
                <input type="text" id="newHostInput" placeholder="add a domain, e.g. vimeo.com" spellcheck="false">
                <button class="btn-mini btn-mini-accent" id="btnAddHost">Add</button>
            </div>
            <div class="host-chips" id="hostChips"></div>
        </div>

        <div class="sites-foot">
            <button class="btn-mini" id="btnToggleOverlay" title="Show or hide the on-video badge">Hide badge</button>
            <button class="btn-mini" id="btnResetBadge" title="Put the badge back to the top of the player">Reset badge position</button>
        </div>
    </div>

    <!-- Main Controls Grid (Volume & Speed Side-by-Side) -->
    <div class="controls-grid">
        <!-- Volume Card -->
        <div class="section control-card">
            <div class="card-meta">
                <div class="card-meta-icon volume-icon-bg">
                    <svg class="meta-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </div>
                <div class="card-meta-text">
                    <span class="card-label">Volume</span>
                    <span class="value-display" id="volumeValue">100%</span>
                </div>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="volumeSlider" min="0" max="500" value="100">
                <div class="slider-ranges">
                    <span>0</span>
                    <span>500%</span>
                </div>
            </div>
            <div class="controls">
                <button class="btn-action" id="btnVolReset">Reset</button>
                <button class="btn-action" id="btnVolMute">Mute</button>
            </div>
        </div>

        <!-- Speed Card -->
        <div class="section control-card">
            <div class="card-meta">
                <div class="card-meta-icon speed-icon-bg">
                    <svg class="meta-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </div>
                <div class="card-meta-text">
                    <span class="card-label">Speed</span>
                    <span class="value-display" id="speedValue">1.00x</span>
                </div>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="speedSlider" min="10" max="1600" step="5" value="100">
                <div class="slider-ranges">
                    <span>0.10x</span>
                    <span>16x</span>
                </div>
            </div>
            <div class="controls">
                <button class="btn-action" id="btnSpeedReset">Normal</button>
                <button class="btn-action" id="btnSpeedFast">2.00x</button>
            </div>
        </div>
    </div>

    <!-- Save Presets Card -->
    <div class="section section-save">
        <div class="save-header">
            <div class="save-header-left">
                <span class="save-title-small">PRESET MEMORY</span>
                <span class="save-title-large">Save Settings</span>
            </div>
            <div id="saveStatusBadge" class="save-badge">NO PRESET</div>
        </div>
        <div class="save-info-banner">
            <span class="status-dot"></span>
            <span id="saveInfo" class="save-info">Settings reset to default for new videos.</span>
        </div>

        <!-- Auto-remember: the hands-free version of the preset system -->
        <div class="auto-remember">
            <div class="auto-remember-head">
                <span class="auto-remember-title">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    Auto-remember
                </span>
                <span class="auto-remember-hint" id="autoHint">New tabs of this site reopen with the same volume.</span>
            </div>
            <div class="seg seg-sm" id="autoSeg" role="group" aria-label="Auto remember scope">
                <button class="seg-btn" data-auto="off">Off</button>
                <button class="seg-btn" data-auto="domain">This site</button>
                <button class="seg-btn" data-auto="global">Everywhere</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn-action btn-save" id="btnSaveTab">Tab</button>
            <button class="btn-action btn-save" id="btnSaveDomain">Domain</button>
            <button class="btn-action btn-save" id="btnSaveGlobal">Global</button>
        </div>
        <button class="btn-reset" id="btnClearPreset">Reset to Default</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
